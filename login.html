        function drawWaveform() {
            if (!analyser || !recordingCtx) return;

            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            analyser.getByteFrequencyData(dataArray);

            const canvas = recordingCanvas;
            const ctx = recordingCtx;
            const width = canvas.width;
            const height = canvas.height;
            const barWidth = (width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            ctx.clearRect(0, 0, width, height);

            const barColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4fc3f7';

            for (let i = 0; i < bufferLength; i++) {
                barHeight = (dataArray[i] / 255) * height;

                ctx.fillStyle = barColor;
                ctx.fillRect(x, height - barHeight, barWidth, barHeight);

                x += barWidth + 1;
            }

            animationFrameId = requestAnimationFrame(drawWaveform);
        }

        function startWaveformVisualization(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);

            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;

            const canvas = recordingCanvas;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            recordingCtx.scale(window.devicePixelRatio, window.devicePixelRatio);

            drawWaveform();
        }

        function stopWaveformVisualization() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            if (recordingCtx) {
                recordingCtx.clearRect(0, 0, recordingCanvas.width, recordingCanvas.height);
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
                analyser = null;
            }
        }

        async function createVoicePlayer(audioUrl, duration) {
            const player = document.createElement('div');
            player.className = 'voice-message-player';

            const playBtn = document.createElement('button');
            playBtn.className = 'play-btn';
            playBtn.innerHTML = '▶';
            playBtn.type = 'button';

            const waveformWrapper = document.createElement('div');
            waveformWrapper.className = 'voice-waveform-wrapper';

            const waveformCanvas = document.createElement('canvas');
            waveformCanvas.className = 'voice-waveform-canvas';
            waveformCanvas.width = 200;
            waveformCanvas.height = 32;

            const durationEl = document.createElement('span');
            durationEl.className = 'voice-duration';
            
            // Validate duration to prevent Infinity:NaN display
            let validDuration = 0;
            if (typeof duration === 'number' && isFinite(duration) && !isNaN(duration) && duration > 0) {
                validDuration = duration;
            } else {
                console.warn('Invalid audio duration:', duration, '- using default 0');
            }
            
            const minutes = Math.floor(validDuration / 60).toString().padStart(2, '0');
            const seconds = Math.floor(validDuration % 60).toString().padStart(2, '0');
            durationEl.textContent = `${minutes}:${seconds}`;

            waveformWrapper.appendChild(waveformCanvas);
            player.appendChild(playBtn);
            player.appendChild(waveformWrapper);
            player.appendChild(durationEl);

            // Generate waveform with better error handling
            try {
                const response = await fetch(audioUrl);
                const arrayBuffer = await response.arrayBuffer();
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                drawPlaybackWaveform(audioBuffer, waveformCanvas);
            } catch (e) {
                console.error('Error generating waveform:', e);
                drawPlaceholderWaveform(waveformCanvas);
            }

            // Audio element
            const audio = new Audio(audioUrl);
            audio.preload = 'auto';

            // Play/Pause functionality
            playBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                
                try {
                    if (audio.paused) {
                        await audio.play();
                        playBtn.innerHTML = '⏸';
                        player.classList.add('playing');
                    } else {
                        audio.pause();
                        playBtn.innerHTML = '▶';
                        player.classList.remove('playing');
                    }
                } catch (error) {
                    console.error('Error playing audio:', error);
                    showToast('Failed to play audio', 'error');
                }
            });

            audio.addEventListener('ended', () => {
                playBtn.innerHTML = '▶';
                player.classList.remove('playing');
            });

            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                showToast('Error playing audio', 'error');
            });

            // Click on waveform to seek
            waveformWrapper.addEventListener('click', (e) => {
                const rect = waveformWrapper.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const percentage = clickX / rect.width;
                audio.currentTime = percentage * duration;
            });

            // Store for cleanup
            activeAudioPlayers.set(player, { audio, playBtn });

            return player;
        }

        function drawPlaceholderWaveform(canvas) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';
            
            // Draw a simple sine wave pattern
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            
            for (let i = 0; i < width; i++) {
                const y = height / 2 + Math.sin(i * 0.1) * (height / 4);
                ctx.lineTo(i, y);
            }
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        async function drawPlaybackWaveform(audioBuffer, canvas) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const data = audioBuffer.getChannelData(0);
            const step = Math.ceil(data.length / width);
            const amp = height / 2;

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#ffffff';

            for (let i = 0; i < width; i++) {
                let min = 1.0;
                let max = -1.0;
                for (let j = 0; j < step; j++) {
                    const datum = data[i * step + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                const barHeight = Math.max(1, (max - min) * amp);
                const barY = (1 + min) * amp;
                ctx.fillRect(i, barY, 1, barHeight);
            }
        }

                .then(stream => {

                    mediaRecorder.ondataavailable = event => {

                    mediaRecorder.onstop = () => {

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                
                // Create a simple beep: 800Hz for 150ms
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                
                osc.start(now);
                osc.stop(now + 0.15);
            } catch (err) {
                console.log('Could not play notification sound:', err);
            }

        async function pollAllChatsForNewMessages() {
            // Poll all chats that are not currently being viewed
            for (const chat of chats) {
                if (currentChat && currentChat.handle === chat.handle) {
                    continue; // Skip the current chat, it's already being polled
                }

                try {
                    // Get the last message ID for this chat from cache
                    const cacheKey = `messages_${chat.handle}`;
                    const cachedMessagesJson = localStorage.getItem(cacheKey);
                    let lastId = '';
                    
                    if (cachedMessagesJson) {
                        try {
                            const cachedMessages = JSON.parse(cachedMessagesJson);
                            if (cachedMessages.length > 0) {
                                const lastMessage = cachedMessages[cachedMessages.length - 1];
                                lastId = lastMessage.id;
                            }
                        } catch (e) {
                            console.error('Error parsing cache for polling:', e);
                        }
                    }

                    // Fetch new messages
                    const url = lastId 
                        ? `/messages/${chat.handle}?after=${encodeURIComponent(lastId)}`
                        : `/messages/${chat.handle}`;

                    const response = await authenticatedFetch(url, {
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    if (!response.ok) {
                        continue; // Skip this chat if fetch failed
                    }

                    const messages = await response.json();

                    if (messages.length > 0) {
                        // Cache new messages
                        const cacheKey = `messages_${chat.handle}`;
                        const cachedMessagesJson = localStorage.getItem(cacheKey);
                        let existingMessages = [];
                        
                        if (cachedMessagesJson) {
                            try {
                                existingMessages = JSON.parse(cachedMessagesJson);
                            } catch (e) {
                                console.error('Error parsing cache:', e);
                            }
                        }

                        // Merge messages
                        const messageMap = new Map();
                        existingMessages.forEach(msg => messageMap.set(msg.id, msg));
                        messages.forEach(msg => messageMap.set(msg.id, msg));

                        // Sort by DECRYPTED timestamp (use async function for proper numeric comparison)
                        const unsortedMessages = Array.from(messageMap.values());
                        const mergedMessages = await sortMessagesByDecryptedTimestamp(unsortedMessages);

                        saveCachedMessages(chat.handle, mergedMessages);

                        // Update polling cursor for this chat

        async function sendWithRetry(url, options, maxRetries = 2) {
            const maxAttempts = maxRetries + 1; // 1 initial + 2 retries = 3 total
            const delays = [500, 1000]; // Exponential backoff in milliseconds
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                try {
                    const response = await authenticatedFetch(url, options);
                    
                    // Don't retry on auth errors (401, 403)
                    if (response.status === 401 || response.status === 403) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    return response;
                } catch (error) {
                    // If this was the last attempt, throw the error
                    if (attempt === maxAttempts - 1) {
                        throw error;
                    }
                    
                    // Wait before retrying (exponential backoff)
                    const delay = delays[attempt] || 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }

        async function sendImageChunked() {
            if (!selectedImage || !currentChat) {
                showToast('No image selected', 'error');
                return;
            }

            if (isUploading) {
                showToast('Upload already in progress', 'error');
                return;
            }

            // Check storage health before attempting upload
            const stats = await getStorageStats();
            if (stats.localStorage.usagePercent > 95) {
                showToast('Storage nearly full! Upload may not cache locally.', 'warning');
            }

            // Validate file size
            const base64Data = selectedImage.split(',')[1];
            const fileSizeBytes = base64Data.length * 0.75; // base64 is ~75% efficient
            if (fileSizeBytes > MAX_IMAGE_SIZE) {
                showToast(`Image too large. Maximum size is ${MAX_IMAGE_SIZE / 1024 / 1024}MB`, 'error');
                window.removeImage();
                return;
            }

            isUploading = true;
            isUploadCancelled = false;
            const uploader = new ChunkedUploader();
            currentUploadSessionId = uploader.sessionId;
            currentUploader = uploader;

            // Setup cancel button
            setupUploadCancel(uploader);

            let uploadSucceeded = false;
            let finalResult = null;
            let encryptedImage = null;

            try {
                showToast('Uploading image...', 'info');
                showUploadProgress(true);

                // Convert base64 to binary
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                const imageData = bytes.buffer;

                // 1. Encrypt the image
                encryptedImage = await encryptBinary(imageData, currentChat.encryptionKey);

                // Convert encrypted data back to binary
                const encryptedBinaryString = atob(encryptedImage);
                const encryptedBytes = new Uint8Array(encryptedBinaryString.length);
                for (let i = 0; i < encryptedBinaryString.length; i++) {
                    encryptedBytes[i] = encryptedBinaryString.charCodeAt(i);
                }

                // 2. Compress the encrypted data
                const compressionResult = await compressData(encryptedBytes.buffer);
                const compressedData = compressionResult.compressed;
                const isCompressed = compressionResult.isCompressed;

                console.log(`Compression: ${encryptedBytes.buffer.byteLength} bytes -> ${compressedData.byteLength} bytes (compressed: ${isCompressed})`);

                // Convert compressed data back to binary if needed
                let finalData = compressedData;
                if (typeof compressedData === 'string') {
                    const compressedBinaryString = atob(compressedData);
                    const compressedBytes = new Uint8Array(compressedBinaryString.length);
                    for (let i = 0; i < compressedBinaryString.length; i++) {
                        compressedBytes[i] = compressedBinaryString.charCodeAt(i);
                    }
                    finalData = compressedBytes.buffer;
                }

                // 3. Chunk and upload with progress
                await uploader.uploadChunked(
                    currentChat.handle,
                    finalData,
                    'image',
                    (progress) => {
                        if (isUploadCancelled) return;
                        console.log(`Upload progress: ${progress.toFixed(0)}%`);
                        updateUploadProgress(progress);
                    }
                );

                // Check if upload was cancelled
                if (isUploadCancelled) {
                    showUploadProgress(false);
                    return;
                }

                // Finalize upload
                const encryptedName = await encryptMessage(userName, currentChat.encryptionKey);
                await ensureTimeSynced();
                const currentTime = getSyncedServerTime();
                const encryptedTimestamp = await encryptTimestampWithServerKey(currentTime);

                const result = await uploader.finalize(
                    currentChat.handle,
                    encryptedName,
                    encryptedTimestamp,
                    'image',
                    isCompressed
                );

                // UPLOAD SUCCESSFUL - Report immediately
                uploadSucceeded = true;
                finalResult = result;
                
                showToast('Image sent successfully!', 'success');
                showUploadProgress(false);
                window.removeImage();
                
            } catch (error) {
                console.error('Image upload error:', error);
                showUploadProgress(false);

                if (!isUploadCancelled) {
                    showToast('Failed to send image', 'error');
                }

                // Try to cancel the upload if it's still active
                if (uploader && uploader.sessionId === currentUploadSessionId && !isUploadCancelled) {
                    try {
                        await uploader.cancel(currentChat.handle);
                    } catch (cancelError) {
                        console.error('Failed to cancel upload:', cancelError);
                    }
                }

                // Clean up on failure
                cleanupFailedUpload(uploader);
            } finally {
                isUploading = false;
                currentUploadSessionId = null;
                currentUploader = null;
            }
            
            // SEPARATE CACHING STEP - Non-blocking, non-fatal
            if (uploadSucceeded && finalResult) {
                try {
                    const actualMessageId = finalResult.messageId;
                    const cached = await cacheContentWithQuota(actualMessageId, encryptedImage);
                    
                    if (!cached) {
                        // Cache failed but upload succeeded - inform user
                        showToast('Image sent but not cached locally (storage full)', 'info');
                        console.warn('Failed to cache image locally due to storage limitations');
                    } else {
                        console.log(`Image cached locally: ${actualMessageId}`);
                    }
                } catch (cacheError) {
                    console.error('Cache error (non-fatal):', cacheError);
                    showToast('Image sent successfully (cache unavailable)', 'info');
                }
                
                // Refresh messages regardless of cache status
                fetchMessages();
            }
        }

        // Encryption functions
        function padKey(keyStr) {
            const encoder = new TextEncoder();
            const data = encoder.encode(keyStr);
            const padded = new Uint8Array(32);
            padded.set(data.slice(0, 32));
            return padded;
        }

        async function encryptMessage(message, key) {
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);
                const iv = crypto.getRandomValues(new Uint8Array(12));

                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(key),
                    { name: 'AES-GCM' },
                    false,
                    ['encrypt']
                );

                const encrypted = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    cryptoKey,
                    data
                );

                const result = new Uint8Array(iv.length + encrypted.byteLength);
                result.set(iv, 0);
                result.set(new Uint8Array(encrypted), iv.length);

                return btoa(String.fromCharCode(...result));
            } catch (error) {
                throw error;
            }
        }

        async function decryptMessage(encryptedMessage, key) {
            try {
                const data = new Uint8Array(atob(encryptedMessage).split('').map(c => c.charCodeAt(0)));
                const iv = data.slice(0, 12);
                const encrypted = data.slice(12);

                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(key),
                    { name: 'AES-GCM' },
                    false,
                    ['decrypt']
                );

                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    cryptoKey,
                    encrypted
                );

                return new TextDecoder().decode(decrypted);
            } catch (error) {
                throw error;
            }
        }

        async function encryptBinary(data, key) {
            try {
                const iv = crypto.getRandomValues(new Uint8Array(12));

                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(key),
                    { name: 'AES-GCM' },
                    false,
                    ['encrypt']
                );

                const encrypted = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv },
                    cryptoKey,
                    data
                );

                const result = new Uint8Array(iv.length + encrypted.byteLength);
                result.set(iv, 0);
                result.set(new Uint8Array(encrypted), iv.length);

                const bytes = new Uint8Array(result);
                let binary = '';
                const chunkSize = 8192;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    const chunk = bytes.subarray(i, i + chunkSize);
                    binary += String.fromCharCode.apply(null, chunk);
                }
                return btoa(binary);
            } catch (err) {
                throw err;
            }
        }

        async function decryptBinary(encryptedData, key) {
            try {
                const binaryString = atob(encryptedData);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const data = bytes;
                const iv = data.slice(0, 12);
                const ciphertext = data.slice(12);

                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(key),
                    { name: 'AES-GCM' },
                    false,
                    ['decrypt']
                );

                return await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv },
                    cryptoKey,
                    ciphertext
                );
            } catch (err) {
                throw err;
            }
        }

        // Download deferred content from server
        async function downloadDeferredContent(messageId, contentType, downloadBtn) {
            if (!currentChat) return;

            let btn = downloadBtn;
            const originalText = btn ? btn.textContent : '⬇️ Download';

            try {
                if (btn) {
                    btn.textContent = '⏳ Downloading...';
                    btn.disabled = true;
                }

                // URL-encode the messageId to handle special characters
                const encodedMessageId = encodeURIComponent(messageId);

                // Download encrypted content from server (NEW FORMAT: /download-content/chatHandle/encodedMessageId)
                const response = await authenticatedFetch(`/download-content/${currentChat.handle}/${encodedMessageId}`, {
                    method: 'GET'
                });

                if (!response.ok) {
                    throw new Error(`Download failed: ${response.status}`);
                }

                const data = await response.json();
                let encryptedBase64 = data.encryptedContent;
                const isCompressed = data.isCompressed || false;

                // If content is compressed, decompress it first using Pako
                if (isCompressed) {
                    try {
                        // Validate that Pako is available
                        if (typeof pako === 'undefined') {
                            console.warn('Pako library not available, attempting to use content as-is');
                            // Continue with current encryptedBase64 (might fail later if actually compressed)
                        } else {
                            // Convert base64 to binary
                            const compressedBinary = atob(encryptedBase64);
                            const compressedBytes = new Uint8Array(compressedBinary.length);
                            for (let i = 0; i < compressedBinary.length; i++) {
                                compressedBytes[i] = compressedBinary.charCodeAt(i);
                            }

                            console.log(`Attempting to decompress ${compressedBytes.length} bytes...`);

                            // Decompress using Pako (inflate) with safe error handling
                            let decompressedArray;
                            try {
                                decompressedArray = pako.inflate(compressedBytes);
                            } catch (pakoError) {
                                // If Pako inflate fails, it might mean:
                                // 1. Data is not actually compressed (server flag is wrong)
                                // 2. Data is corrupted
                                // 3. Data is using a different compression format
                                console.warn('Pako inflate failed:', pakoError.message);
                                console.warn('Attempting fallback: using content as-is (assuming not compressed)');
                                
                                // Try using the data as-is without decompression
                                // This handles cases where the isCompressed flag is incorrect
                                decompressedArray = compressedBytes;
                            }

                            // Convert decompressed bytes back to base64 using chunked conversion
                            // This prevents "Maximum call stack size exceeded" errors for large files
                            try {
                                const decompressedBase64 = uint8ArrayToBase64(decompressedArray);
                                encryptedBase64 = decompressedBase64;
                                console.log(`Decompression complete: ${compressedBytes.length} bytes -> ${decompressedArray.length} bytes`);
                            } catch (btoa_err) {
                                console.error('Error converting decompressed data to base64:', btoa_err);
                                throw new Error('Failed to encode decompressed content');
                            }
                        }
                    } catch (decompressErr) {
                        console.error('Decompression error:', decompressErr);
                        showToast(`Decompression failed: ${decompressErr.message}`, 'error');
                        throw new Error('Failed to decompress content');
                    }
                }

                // Cache the encrypted content (now decompressed) with quota management
                await cacheContentWithQuota(messageId, encryptedBase64);

                showToast(`${contentType === 'voice' ? 'Voice' : 'Image'} cached!`, 'success');

                // Re-render the message with actual content
                const messageGroup = document.querySelector(`[data-message-id="${messageId}"]`);
                if (messageGroup) {
                    const messageBubble = messageGroup.querySelector('.message');
                    if (messageBubble) {
                        try {
                            // Find the deferred content element to replace
                            const deferredElement = messageBubble.querySelector('.deferred-content');
                            
                            if (!deferredElement) {
                                console.warn('Deferred element not found');
                                if (btn) {
                                    btn.textContent = originalText;
                                    btn.disabled = false;
                                }
                                return;
                            }
                            
                            if (contentType === 'voice') {
                                const decryptedAudioBuffer = await decryptBinary(encryptedBase64, currentChat.encryptionKey);
                                const audioBlob = new Blob([decryptedAudioBuffer], { type: 'audio/webm' });
                                const audioUrl = createTrackedBlobUrl(audioBlob);
                                const audio = new Audio(audioUrl);
                                
                                const duration = await new Promise(resolve => {
                                    audio.addEventListener('loadedmetadata', () => {
                                        resolve(audio.duration);
                                    });
                                    audio.addEventListener('error', () => {
                                        resolve(0);
                                    });
                                });

                                const voicePlayer = await createVoicePlayer(audioUrl, duration);
                                
                                // Replace the deferred element with the voice player
                                if (deferredElement.parentElement) {
                                    deferredElement.parentElement.replaceChild(voicePlayer, deferredElement);
                                }
                            } else if (contentType === 'image') {
                                const decryptedImageBuffer = await decryptBinary(encryptedBase64, currentChat.encryptionKey);
                                const imageBlob = new Blob([decryptedImageBuffer], { type: 'image/*' });
                                const imageUrl = createTrackedBlobUrl(imageBlob);

                                const imgHtml = `<img class="message-image" src="${imageUrl}" alt="Image" onclick="openLightbox('${imageUrl}')">`;
                                
                                // Replace the deferred element with new image content
                                const newContentDiv = document.createElement('div');
                                newContentDiv.innerHTML = imgHtml;
                                
                                if (deferredElement.parentElement) {
                                    deferredElement.parentElement.replaceChild(newContentDiv, deferredElement);
                                }
                            }
                        } catch (err) {
                            console.error('Error rendering downloaded content:', err);
                            showToast('Error displaying content', 'error');
                            if (btn) {
                                btn.textContent = originalText;
                                btn.disabled = false;
                            }
                        }
                    }
                }

                if (btn) {
                    btn.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Download error:', error);
                showToast(`Failed to download ${contentType}`, 'error');
                if (btn) {
                    btn.textContent = '⬇️ Download';
                    btn.disabled = false;
                }
            }
        }

        // Enhanced voice message sending with race condition protection
        async function sendVoiceMessageWithRetry(audioBlob) {
            // Prevent concurrent voice message sends
            if (window.isVoiceUploading) {
                showToast('Voice upload already in progress', 'error');
                return;
            }

            window.isVoiceUploading = true;

            try {
                await sendVoiceMessage(audioBlob);
            } finally {
                window.isVoiceUploading = false;
            }
        }

        // Override the original sendVoiceMessage to use the retry wrapper
        const originalSendVoiceMessage = sendVoiceMessage;
        sendVoiceMessage = async function(audioBlob) {
            if (window.isVoiceUploading) {

        // Restore in-progress transfers from localStorage
        async function restoreInProgressTransfers() {
            try {
                const savedTransfers = localStorage.getItem('p2p_in_progress_transfers');
                if (!savedTransfers) return;
                
                const transfers = JSON.parse(savedTransfers);
                for (const transfer of transfers) {
                    if (transfer.direction === 'sending' && transfer.status === 'in_progress') {
                        // Re-show progress for sending transfers
                        showTransferProgress(transfer.sessionId, transfer.fileName, transfer.fileSize, 'sending');
                    } else if (transfer.direction === 'receiving' && transfer.status === 'in_progress') {
                        // Re-show progress for receiving transfers
                        showTransferProgress(transfer.sessionId, transfer.fileName, transfer.fileSize, 'receiving');
                    }
                }
            } catch (error) {
                console.warn('Failed to restore in-progress transfers:', error);
            }
        }

        // Save in-progress transfers to localStorage
        function saveInProgressTransfers() {
            const transfers = [];
            for (const [sessionId, transfer] of activeTransfers) {
                transfers.push({
                    sessionId,
                    fileName: transfer.fileName,
                    fileSize: transfer.fileSize,
                    direction: transfer.direction,
                    status: transfer.status
                });
            }
            try {
                localStorage.setItem('p2p_in_progress_transfers', JSON.stringify(transfers));
            } catch (error) {
                console.warn('Failed to save in-progress transfers:', error);
            }
        }

        // Handle file selection

        // Initiate P2P transfer handler
        async function initiateP2PTransferHandler() {
            if (!p2pSelectedFile || !currentChat) {
                showToast('No file selected', 'error');
                return;
            }

            const initiateBtn = document.getElementById('initiate-p2p-transfer');
            let transferSessionId = null;

            try {
                initiateBtn.disabled = true;
                showToast('Initiating transfer...', 'info');

                // Calculate chunks
                const chunkSize = 256 * 1024; // 256KB
                const totalChunks = Math.ceil(p2pSelectedFile.size / chunkSize);

                // Initiate transfer on server (creates session but doesn't start sending yet)
                const result = await p2pTransferManager.initiateTransfer(
                    currentChat.handle,
                    p2pSelectedFile
                );

                transferSessionId = result.sessionId;

                // Show progress UI with "awaiting acceptance" status
                showTransferProgressAwaitingAcceptance(transferSessionId, p2pSelectedFile.name, p2pSelectedFile.size);

                // Store transfer for progress tracking
                activeTransfers.set(transferSessionId, {
                    fileName: p2pSelectedFile.name,
                    fileSize: p2pSelectedFile.size,
                    direction: 'sending',
                    status: 'awaiting_acceptance'
                });
                saveInProgressTransfers();

                showToast('Transfer invitation sent to chat. Waiting for acceptance...', 'success');
                closeP2PTransferModal();

                // PHASE 1: Wait for receiver to accept
                console.log(`[P2P] Waiting for team member to accept transfer ${transferSessionId}...`);
                const accepted = await p2pTransferManager.waitForAcceptance(transferSessionId);
                
                if (!accepted) {
                    throw new Error('Transfer was not accepted');
                }

                console.log(`[P2P] Transfer ${transferSessionId} accepted by receiver. Starting transfer...`);
                
                // Update transfer status
                const transferData = activeTransfers.get(transferSessionId);
                if (transferData) {
                    transferData.status = 'transferring';
                    saveInProgressTransfers();
                }

                // Update UI to show transfer is starting
                updateTransferProgressToSending(transferSessionId);

                // PHASE 2: Start sending chunks now that receiver has accepted
                await p2pTransferManager.startTransfer(transferSessionId);

                // Get the transfer object to listen for events
                const transfer = result.transfer;

                // Listen for completion
                transfer.on('chunkSent', (data) => {
                    const progress = ((data.chunkIndex + 1) / transfer.totalChunks) * 100;
                    updateTransferProgress(transferSessionId, progress, totalChunks);
                });

                transfer.on('sendComplete', () => {
                    showToast('File sent successfully!', 'success');
                    completeTransferProgress(transferSessionId);
                    activeTransfers.delete(transferSessionId);
                    saveInProgressTransfers();
                });

                transfer.on('sendFailed', (data) => {
                    showToast(`Transfer failed: ${data.error.message}`, 'error');
                    failTransferProgress(transferSessionId, data.error.message);
                    activeTransfers.delete(transferSessionId);
                    saveInProgressTransfers();
                });

            } catch (error) {
                console.error('Failed to initiate transfer:', error);
                showToast(`Transfer failed: ${error.message}`, 'error');
                
                if (transferSessionId) {
                    failTransferProgress(transferSessionId, error.message);
                    activeTransfers.delete(transferSessionId);
                    saveInProgressTransfers();
                }
                
                if (initiateBtn) initiateBtn.disabled = false;
            }
        }

        // Show transfer progress with "awaiting acceptance" status
        function showTransferProgressAwaitingAcceptance(sessionId, fileName, fileSize) {

        // Show transfer progress UI
        function showTransferProgress(sessionId, fileName, fileSize, direction) {
            const container = document.getElementById('p2p-transfer-progress-container');
            if (!container) return;

            const progressEl = document.createElement('div');

            `;

        // Debounce progress updates to batch DOM operations
        const pendingProgressUpdates = new Map();
        let progressUpdateScheduled = false;

        function flushProgressUpdates() {
            pendingProgressUpdates.forEach(({ progress, totalChunks }, sessionId) => {
                const progressEl = document.getElementById(`p2p-progress-${sessionId}`);
                const progressText = document.getElementById(`p2p-progress-text-${sessionId}`);

                if (progressEl) {
                    const fill = progressEl.querySelector('.p2p-transfer-progress-fill');
                    if (fill) {
                        fill.style.width = `${Math.round(progress)}%`;
                    }
                }

                if (progressText) {
                    progressText.textContent = `${Math.round(progress)}%`;
                }
            });
            pendingProgressUpdates.clear();
            progressUpdateScheduled = false;
        }

        // Update transfer progress (debounced)
        function updateTransferProgress(sessionId, progress, totalChunks) {
            pendingProgressUpdates.set(sessionId, { progress, totalChunks });
            if (!progressUpdateScheduled) {
                progressUpdateScheduled = true;
                requestAnimationFrame(flushProgressUpdates);
            }
        }

        // Complete transfer progress
        function completeTransferProgress(sessionId) {
            const progressEl = document.getElementById(`p2p-progress-${sessionId}`);
            if (progressEl) {
                const fill = progressEl.querySelector('.p2p-transfer-progress-fill');
                const details = progressEl.querySelector('.p2p-transfer-details');
                const progressText = document.getElementById(`p2p-progress-text-${sessionId}`);
                const cancelBtn = progressEl.querySelector('.p2p-transfer-cancel-btn');
                
                if (fill) fill.style.width = '100%';
                if (details) details.textContent = '✓ Completed';
                if (progressText) progressText.textContent = '100%';
                if (cancelBtn) cancelBtn.style.display = 'none';
                
                // Auto-remove after 5 seconds
                setTimeout(() => {
                    progressEl.remove();
                }, 5000);
            }
        }

        // Fail transfer progress
        function failTransferProgress(sessionId, errorMessage) {
            const progressEl = document.getElementById(`p2p-progress-${sessionId}`);
            if (progressEl) {
                const fill = progressEl.querySelector('.p2p-transfer-progress-fill');
                const details = progressEl.querySelector('.p2p-transfer-details');
                const progressText = document.getElementById(`p2p-progress-text-${sessionId}`);
                
                if (fill) fill.style.background = 'var(--error)';
                if (details) details.textContent = `✗ Failed: ${errorMessage}`;
                if (progressText) progressText.textContent = 'Failed';
            }
        }

        };

        // Open P2P invitations modal
        async function openP2PInvitationsModal() {
            if (!p2pInvitationsModal || !currentChat) return;

            await renderPendingInvitations();
            p2pInvitationsModal.classList.add('active');
        }

        // Render pending invitations
        async function renderPendingInvitations(invitations) {
            const listEl = document.getElementById('pending-invitations-list');
            const noInvitationsEl = document.getElementById('no-invitations');
            
            if (!listEl || !noInvitationsEl) return;

            if (!invitations) {
                try {
                    invitations = await p2pTransferManager.getPendingInvitations(currentChat.handle);
                } catch (error) {
                    console.error('Failed to get invitations:', error);
                    invitations = [];
                }
            }

            if (invitations.length === 0) {
                listEl.innerHTML = '';
                noInvitationsEl.style.display = 'block';
                return;
            }

            noInvitationsEl.style.display = 'none';
            listEl.innerHTML = '';

            for (const invitation of invitations) {
                // Decrypt sender name if available
                let displaySenderName = 'Unknown';
                if (invitation.senderName && currentChat && currentChat.encryptionKey) {
                    try {
                        displaySenderName = await decryptMessage(invitation.senderName, currentChat.encryptionKey);
                    } catch (e) {
                        console.warn('Failed to decrypt sender name:', e);
                        displaySenderName = 'Unknown';
                    }
                }

                const item = document.createElement('div');
                item.className = 'pending-invitation-item';
                item.innerHTML = `
                    <div class="pending-invitation-info">
                        <div class="pending-invitation-file-name">${escapeHtml(invitation.fileName)}</div>
                        <div class="pending-invitation-sender">From: ${escapeHtml(displaySenderName)}</div>
                        <div class="pending-invitation-size">${formatFileSize(invitation.fileSize)}</div>
                    </div>
                    <div class="pending-invitation-actions">
                        <button class="pending-invitation-btn accept" onclick="acceptP2PInvitation('${invitation.transferSessionId}', ${invitation.totalChunks}, '${escapeHtml(invitation.fileName)}', ${invitation.fileSize})">Accept</button>
                        <button class="pending-invitation-btn decline" onclick="declineP2PInvitation('${invitation.transferSessionId}')">Decline</button>
                    </div>
                `;
                listEl.appendChild(item);
            }
        }

        // Accept P2P invitation
        window.acceptP2PInvitation = async function(transferSessionId, totalChunks, fileName, fileSize) {
            try {
                showToast('Accepting transfer...', 'info');

                // Accept the transfer (pass fileName for tracking)
                await p2pTransferManager.acceptTransfer(currentChat.handle, transferSessionId, totalChunks, fileName);

                // Show progress UI
                showTransferProgress(transferSessionId, fileName, fileSize, 'receiving');

                // Store transfer for progress tracking
                activeTransfers.set(transferSessionId, {
                    fileName: fileName,
                    fileSize: fileSize,
                    direction: 'receiving',
                    status: 'in_progress'
                });
                saveInProgressTransfers();

                // Start receiving chunks
                const transfer = await p2pTransferManager.startReceiving(
                    currentChat.handle,
                    transferSessionId,
                    totalChunks,
                    (progress) => {
                        updateTransferProgress(transferSessionId, progress, totalChunks);
                    }
                );

                // Listen for completion
                transfer.on('completed', async (assembledData) => {
                    showToast('File received!', 'success');

                    // Save assembled file locally (server chunks are cleared after transfer)
                    const blob = new Blob([assembledData]);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    completeTransferProgress(transferSessionId);
                    activeTransfers.delete(transferSessionId);
                    saveInProgressTransfers();

                    // Close modal and refresh invitations
                    const invitationsModal = document.getElementById('p2p-invitations-modal');
                    if (invitationsModal) invitationsModal.classList.remove('active');

                    showToast('File downloaded successfully!', 'success');
                });

                transfer.on('error', (error) => {
                    showToast(`Transfer failed: ${error.message}`, 'error');
                    failTransferProgress(transferSessionId, error.message);
                    activeTransfers.delete(transferSessionId);
                    saveInProgressTransfers();
                });

                showToast('Transfer accepted! Receiving...', 'success');
                
                // Refresh invitations list
                await renderPendingInvitations();

            } catch (error) {
                console.error('Failed to accept invitation:', error);
                showToast(`Failed to accept transfer: ${error.message}`, 'error');
            }
        };

        // Decline P2P invitation
        window.declineP2PInvitation = async function(transferSessionId) {
            try {
                // For now, just close the modal
                // In the future, we could send a decline notification
                const invitationsModal = document.getElementById('p2p-invitations-modal');
                if (invitationsModal) invitationsModal.classList.remove('active');
                
                showToast('Transfer declined', 'info');
            } catch (error) {
                console.error('Failed to decline invitation:', error);
            }
        };

        // Format file size for display
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
