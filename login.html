<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat</title>
    <script src="auth.js"></script>
    <script src="pako.min.js"></script>
    <script src="content-cache-db.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0e0e0e;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2d2d2d;
            --bg-own: #4fc3f7;
            --bg-received: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #4fc3f7;
            --error: #e74c3c;
            --success: #2ecc71;
            --message-radius: 16px;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Setup Screen */
        .setup-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #0e0e0e 0%, #1a1a1a 100%);
        }

        .setup-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .setup-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            color: var(--text-primary);
        }

        .setup-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            background: #3d3d3d;
            box-shadow: 0 0 0 2px var(--accent);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 195, 247, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: #3d3d3d;
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
        }

        /* Chat List Screen */
        .chat-list-container {
            display: none;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-primary);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .search-bar {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            background: #3d3d3d;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s ease;
            position: relative;
        }

        .chat-item:hover {
            background: var(--bg-secondary);
        }

        .chat-item:active {
            background: var(--bg-tertiary);
        }

        .chat-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #2196F3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .chat-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .last-message {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            min-width: 20px;
            height: 20px;
            background: var(--accent);
            color: #000;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .message-status-icon {
            font-size: 12px;
            margin-left: 6px;
            display: inline-block;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--error);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .chat-item:hover .delete-btn {
            opacity: 1;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .empty-state-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            max-width: 300px;
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            border: none;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(79, 195, 247, 0.4);
            transition: all 0.3s ease;
            z-index: 90;
        }

        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(79, 195, 247, 0.5);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions .btn {
            flex: 1;
            margin-top: 0;
        }

        /* Chat Screen */
        .chat-container {
            display: none;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-primary);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .chat-info {
            flex: 1;
        }

        .chat-status {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: background 0.3s ease;
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.6);
        }

        .status-dot.disconnected {
            background: var(--error);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 4px;
        }

        .message {
            max-width: 80%;
            margin-bottom: 4px;
            padding: 12px 16px;
            border-radius: var(--message-radius);
            position: relative;
            word-wrap: break-word;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            align-self: flex-end;
            background: var(--bg-own);
            color: #000;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: var(--bg-received);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 12px;
            opacity: 0.7;
        }

        .message.own .message-header {
            justify-content: flex-end;
            gap: 8px;
        }

        .message-sender {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .status-indicator.online {
            background-color: var(--success);
            box-shadow: 0 0 4px rgba(46, 204, 113, 0.6);
        }

        .status-indicator.offline {
            background-color: var(--text-secondary);
        }

        .message-time {
            font-size: 11px;
        }

        .message-content {
            font-size: 15px;
            line-height: 1.5;
        }

        .message-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .message-audio {
            width: 200px;
            height: 32px;
        }

        /* Upload Progress Indicator */
        .upload-progress {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-radius: 24px;
            margin-bottom: 8px;
        }

        .upload-progress.active {
            display: flex;
        }

        .upload-progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .upload-progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .upload-progress-text {
            font-size: 14px;
            color: var(--text-secondary);
            min-width: 45px;
            text-align: right;
        }

        .upload-cancel-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--error);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-cancel-btn:hover {
            transform: scale(1.1);
        }

        /* Input Area */
        .input-area {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-container {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .attachment-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .attachment-btn:hover {
            background: #3d3d3d;
            transform: scale(1.05);
        }

        .attachment-btn.active {
            background: var(--accent);
            color: #000;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-tertiary);
            border-radius: 24px;
            padding: 8px 16px;
        }

        .message-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            max-height: 100px;
            resize: none;
            line-height: 1.5;
        }

        .message-input::placeholder {
            color: var(--text-secondary);
        }

        .image-preview {
            display: none;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .image-preview.active {
            display: flex;
        }

        .preview-item {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--error);
            color: white;
            border: none;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        /* Voice Recording */
        .voice-recording {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-radius: 24px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(231, 76, 60, 0);
            }
        }

        .voice-recording.active {
            display: flex;
        }

        .recording-indicator {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--error);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .recording-time {
            font-size: 16px;
            font-weight: 600;
        }

        .recording-actions {
            display: flex;
            gap: 8px;
        }

        .recording-action {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .recording-action.stop {
            background: var(--error);
            color: white;
        }

        .recording-action.cancel {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .recording-action:hover {
            transform: scale(1.1);
        }

        /* Waveform Visualization */
        .waveform-container {
            flex: 1;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .waveform-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .voice-waveform-wrapper {
            flex: 1;
            height: 32px;
            cursor: pointer;
            display: block;
        }

        .voice-waveform-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Voice Message Player */
        .voice-message-player {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .message.own .voice-message-player {
            background: rgba(0, 0, 0, 0.1);
        }

        .voice-message-player.playing .play-btn {
            background: rgba(255, 255, 255, 0.3);
        }

        .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
            border: none;
            color: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .play-btn:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: scale(1.05);
        }

        .voice-waveform-wrapper {
            flex: 1;
            height: 32px;
            cursor: pointer;
        }

        .voice-duration {
            font-size: 12px;
            opacity: 0.7;
            min-width: 40px;
            text-align: right;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;

    <script>
        // ==================== COMPRESSION UTILITIES ====================

        // Compress data using Brotli via Pako
        async function compressData(data) {
            try {
                // Check if we have access to compression APIs
                if (typeof pako === 'undefined') {
                    console.warn('Pako library not available, skipping compression');
                    return {
                        compressed: data,
                        isCompressed: false
                    };
                }

                // Skip compression for small data (under 1KB) to avoid overhead
                if (data.byteLength < 1024) {
                    console.log(`Data too small for compression (${data.byteLength} bytes), skipping`);
                    return {
                        compressed: data,
                        isCompressed: false
                    };
                }

                console.log(`Compressing ${data.byteLength} bytes with Brotli...`);

                // Use Pako for compression - it provides good compression ratios
                const compressedArray = pako.deflate(new Uint8Array(data));
                const compressionRatio = (data.byteLength - compressedArray.length) / data.byteLength * 100;

                console.log(`✅ Compression complete: ${data.byteLength} → ${compressedArray.length} bytes (${compressionRatio.toFixed(1)}% reduction)`);

                return {
                    compressed: compressedArray.buffer, // Return as ArrayBuffer
                    isCompressed: true
                };
            } catch (error) {
                console.error('Compression error:', error);
                return {
                    compressed: data,
                    isCompressed: false
                };
            }
        }

        // Decompress data
        async function decompressData(data, isCompressed) {
            if (!isCompressed) {
                return data;
            }
            
            try {
                // For decompression with Brotli
                if (typeof BrotliDecode !== 'undefined') {
                    return BrotliDecode(new Uint8Array(data));
                }
                return data;
            } catch (error) {
                console.error('Decompression error:', error);
                return data;
            }
        }

        // ==================== UTILITY FUNCTIONS ====================

        // Convert Uint8Array to base64 string using chunking to avoid stack overflow
        // This prevents "Maximum call stack size exceeded" errors for large files
        function uint8ArrayToBase64(uint8Array) {
            let binary = '';
            const chunkSize = 32768; // 32KB chunks - safe for all browsers
            for (let i = 0; i < uint8Array.length; i += chunkSize) {
                const chunk = uint8Array.subarray(i, Math.min(i + chunkSize, uint8Array.length));
                binary += String.fromCharCode.apply(null, chunk);
            }
            return btoa(binary);
        }

        // ==================== LOCALSTORAGE QUOTA MANAGEMENT ====================
        
        // Constants for cache management
        const MAX_CACHE_SIZE_BYTES = 4 * 1024 * 1024; // 4MB limit for mobile safety
        const CONTENT_KEY_PREFIX = 'content_';
        
        // IndexedDB cache status
        let indexedDBReady = false;
        let migrationDone = false;

        // Initialize IndexedDB and perform migration
        async function initializeStorage() {
            try {
                // Check if IndexedDB is available
                if (typeof contentCacheDB === 'undefined') {
                    console.warn('IndexedDB not available, using localStorage only');
                    return;
                }
                
                // Initialize the database
                await contentCacheDB.init();
                indexedDBReady = true;
                console.log('✅ IndexedDB initialized successfully');
                
                // Check if migration is needed
                if (!migrationDone) {
                    await migrateFromLocalStorage();
                }
            } catch (error) {
                console.warn('Failed to initialize IndexedDB, falling back to localStorage:', error);
                indexedDBReady = false;
            }
        }

        // Migrate existing localStorage content to IndexedDB
        async function migrateFromLocalStorage() {
            try {
                // Check if migration marker exists
                const migrationMarker = localStorage.getItem('indexedDBMigrationComplete');
                if (migrationMarker) {
                    console.log('Migration already completed');
                    migrationDone = true;
                    return;
                }
                
                console.log('Starting migration from localStorage to IndexedDB...');
                
                // Find all content items in localStorage
                const contentKeys = [];
                for (let key in localStorage) {
                    if (key.startsWith(CONTENT_KEY_PREFIX)) {
                        contentKeys.push(key);
                    }
                }
                
                console.log(`Found ${contentKeys.length} items to migrate`);
                
                let migratedCount = 0;
                for (const key of contentKeys) {
                    try {
                        const messageId = key.replace(CONTENT_KEY_PREFIX, '');
                        const content = localStorage.getItem(key);
                        
                        if (content && content !== 'PLACEHOLDER') {
                            // Store in IndexedDB
                            await contentCacheDB.setContent(messageId, content, null);
                            migratedCount++;
                        }
                    } catch (err) {
                        console.warn(`Failed to migrate ${key}:`, err);
                    }
                }
                
                console.log(`✅ Migration complete: ${migratedCount}/${contentKeys.length} items migrated`);
                
                // Mark migration as complete
                localStorage.setItem('indexedDBMigrationComplete', Date.now().toString());
                migrationDone = true;
                
            } catch (error) {
                console.error('Migration failed:', error);
                // Continue without migration - localStorage will still work
            }
        }
        
        // Estimate current localStorage usage
        function getLocalStorageUsage() {
            try {
                let totalBytes = 0;
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        totalBytes += (localStorage[key].length + key.length) * 2; // UTF-16
                    }
                }
                return totalBytes;
            } catch (e) {
                return 0;
            }
        }
        
        // Check if we can store data of given size
        function canStoreInCache(dataSize) {
            try {
                const currentUsage = getLocalStorageUsage();
                return (currentUsage + dataSize) < MAX_CACHE_SIZE_BYTES;
            } catch (e) {
                return false;
            }
        }
        
        // Evict oldest cached content to make space
        function evictOldestCachedContent() {
            const contentKeys = [];
            for (let key in localStorage) {
                if (key.startsWith(CONTENT_KEY_PREFIX)) {
                    contentKeys.push(key);
                }
            }
            if (contentKeys.length > 0) {
                // Remove first (oldest) content - keys are in insertion order
                localStorage.removeItem(contentKeys[0]);
                console.log(`Evicted cached content: ${contentKeys[0]}`);
                return true;
            }
            return false;
        }
        
        // Safely cache content with quota management
        async function cacheContentWithQuota(messageId, encryptedBase64, chatHandle = null) {
            const dataSize = encryptedBase64.length * 2; // UTF-16 estimate
            
            // Try IndexedDB first if available
            if (indexedDBReady && typeof contentCacheDB !== 'undefined') {
                try {
                    await contentCacheDB.setContent(messageId, encryptedBase64, chatHandle);
                    console.log(`✅ Cached content for message ${messageId} in IndexedDB (${dataSize} bytes)`);
                    return true;
                } catch (error) {
                    console.warn(`IndexedDB cache failed for ${messageId}:`, error);
                    // Continue to localStorage fallback
                }
            }
            
            // Fallback to localStorage with quota management
            // Check if data is too large to ever fit in localStorage
            if (dataSize > MAX_CACHE_SIZE_BYTES * 0.8) {
                console.warn(`Content too large to cache in localStorage (${dataSize} bytes > ${MAX_CACHE_SIZE_BYTES * 0.8} bytes)`);
                return false;
            }
            
            // Try up to 10 times with progressive eviction
            let attempts = 0;
            const maxAttempts = 10;
            
            while (attempts < maxAttempts) {
                try {
                    // Try to store directly
                    localStorage.setItem(`${CONTENT_KEY_PREFIX}${messageId}`, encryptedBase64);
                    console.log(`✅ Cached content for message ${messageId} in localStorage (${dataSize} bytes)`);
                    return true;
                    
                } catch (e) {
                    if (e.name === 'QuotaExceededError') {
                        console.warn(`QuotaExceededError on attempt ${attempts + 1}/${maxAttempts}`);
                        
                        // Get current usage stats
                        const usage = getLocalStorageUsage();
                        const contentCount = getContentKeyCount();
                        console.log(`Current usage: ${usage} bytes, ${contentCount} cached items`);
                        
                        // Try to evict oldest content
                        let evicted = evictOldestCachedContent();
                        
                        if (!evicted) {
                            // No more content to evict - try evicting message cache
                            evicted = evictOldestMessageCache();
                            if (!evicted) {
                                console.error('No more items to evict, cache is full');
                                return false;
                            }
                        }
                        
                        // Wait a bit before retry to let browser process
                        await new Promise(resolve => setTimeout(resolve, 50));
                        
                    } else {
                        // Other error - don't retry
                        console.error('Unexpected cache error:', e);
                        return false;
                    }
                }
                
                attempts++;
            }
            
            console.warn(`Failed to cache content after ${maxAttempts} attempts`);
            return false;
        }

        // ==================== CHUNKED UPLOAD CLASS ====================
        
        class ChunkedUploader {
            constructor() {
                this.chunkSize = 512 * 1024; // 512KB chunks
                this.sessionId = this.generateUUID();
                this.uploadedChunks = 0;
            }

            generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            async uploadChunked(chatHandle, data, messageType, onProgress) {
                try {
                    const totalChunks = Math.ceil(data.byteLength / this.chunkSize);
                    console.log(`Uploading ${messageType} with ${totalChunks} chunks (${data.byteLength} bytes total)`);

                    // Upload each chunk
                    for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
                        const start = chunkIndex * this.chunkSize;
                        const end = Math.min(start + this.chunkSize, data.byteLength);
                        const chunkData = data.slice(start, end);

                        // Create metadata and chunk payload
                        const metadata = {
                            sessionId: this.sessionId,
                            chunkIndex: chunkIndex,
                            totalChunks: totalChunks,
                            messageType: messageType
                        };

                        const metadataStr = JSON.stringify(metadata);
                        const metadataBuffer = new TextEncoder().encode(metadataStr);
                        
                    // Combine metadata and chunk data
                    const separator = new TextEncoder().encode('\r\n\r\n');
                    const chunkDataArray = new Uint8Array(chunkData);
                    const combined = new Uint8Array(metadataBuffer.length + separator.length + chunkDataArray.length);
                    combined.set(metadataBuffer, 0);
                    combined.set(separator, metadataBuffer.length);
                    combined.set(chunkDataArray, metadataBuffer.length + separator.length);

                        // Upload this chunk
                        const response = await authenticatedFetch(`/upload-chunk/${chatHandle}`, {
                            method: 'POST',
                            body: combined
                        });

                        if (!response.ok) {
                            throw new Error(`Failed to upload chunk ${chunkIndex}: ${response.status}`);
                        }

                        this.uploadedChunks = chunkIndex + 1;
                        const progress = (this.uploadedChunks / totalChunks) * 100;
                        if (onProgress) {
                            onProgress(progress);
                        }

                        console.log(`Uploaded chunk ${chunkIndex + 1}/${totalChunks}`);
                    }

                    console.log('All chunks uploaded successfully');
                    return true;
                } catch (error) {
                    console.error('Chunked upload error:', error);
                    throw error;
                }
            }

            async finalize(chatHandle, encryptedName, encryptedTimestamp, messageType, isCompressed = false) {
                try {
                    const response = await authenticatedFetch(`/upload-complete/${chatHandle}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sessionId: this.sessionId,
                            encryptedName: encryptedName,
                            encryptedTimestamp: encryptedTimestamp,
                            messageType: messageType,
                            isCompressed: isCompressed
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Failed to finalize upload: ${response.status}`);
                    }

                    const result = await response.json();
                    console.log('Upload completed:', result);
                    return result;
                } catch (error) {
                    console.error('Finalize error:', error);
                    throw error;
                }
            }

            async cancel(chatHandle) {
                try {
                    const response = await authenticatedFetch(`/upload-cancel/${chatHandle}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId: this.sessionId })
                    });

                    if (!response.ok) {
                        console.warn(`Failed to cancel upload: ${response.status}`);
                    }
                } catch (error) {
                    console.error('Cancel error:', error);
                }
            }
        }

        // ==================== TIME SYNCHRONIZATION ====================

        // Decrypt timestamp from server
        async function decryptServerTimestamp(encryptedTimestamp) {
            try {
                const SERVER_ENCRYPTION_KEY = getServerEncryptionKey();
                if (!SERVER_ENCRYPTION_KEY) return null;

                // Convert base64 to binary
                const data = new Uint8Array(atob(encryptedTimestamp).split('').map(c => c.charCodeAt(0)));

                // Extract components: IV (12 bytes) + encrypted data + auth tag (16 bytes)
                const iv = data.slice(0, 12);
                const authTag = data.slice(-16);
                const encrypted = data.slice(12, -16);

                // Create key for Web Crypto API
                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(SERVER_ENCRYPTION_KEY),
                    { name: 'AES-GCM' },
                    false,
                    ['decrypt']
                );

                // Combine encrypted data with auth tag for Web Crypto API format
                const combinedEncrypted = new Uint8Array(encrypted.length + authTag.length);
                combinedEncrypted.set(encrypted, 0);
                combinedEncrypted.set(authTag, encrypted.length);

                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    cryptoKey,
                    combinedEncrypted
                );

                return parseInt(new TextDecoder().decode(decrypted), 10);
            } catch (error) {
                console.error('Failed to decrypt server timestamp:', error);
                throw error;
            }
        }

        // Encrypt timestamp using server key
        async function encryptTimestampWithServerKey(timestamp) {
            try {
                const SERVER_ENCRYPTION_KEY = getServerEncryptionKey();
                if (!SERVER_ENCRYPTION_KEY) return null;

                const encoder = new TextEncoder();
                const data = encoder.encode(timestamp.toString());
                const iv = crypto.getRandomValues(new Uint8Array(12));

                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(SERVER_ENCRYPTION_KEY),
                    { name: 'AES-GCM' },
                    false,
                    ['encrypt']
                );

                const encrypted = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    cryptoKey,
                    data
                );

                // Combine IV and encrypted data
                const result = new Uint8Array(iv.length + encrypted.byteLength);
                result.set(iv, 0);
                result.set(new Uint8Array(encrypted), iv.length);

                // Convert to base64 for transmission
                return btoa(String.fromCharCode(...result));
            } catch (error) {
                console.error('Timestamp encryption error:', error);
                throw error;
            }
        }

        // Sync time with server
        async function syncServerTime() {
            try {
                const clientTime = Date.now();
                const response = await fetch('/time-sync', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) {
                    console.warn('Failed to sync server time:', response.status);
                    return false;
                }

                const data = await response.json();
                const encryptedTime = data.encryptedTime;

                // Decrypt server time
                try {
                    const SERVER_ENCRYPTION_KEY = getServerEncryptionKey();
                    if (!SERVER_ENCRYPTION_KEY) return false;

                    const serverTimeBinary = new Uint8Array(atob(encryptedTime).split('').map(c => c.charCodeAt(0)));
                    const iv = serverTimeBinary.slice(0, 12);
                    const encrypted = serverTimeBinary.slice(12);

                    const cryptoKey = await crypto.subtle.importKey(
                        'raw',
                        padKey(SERVER_ENCRYPTION_KEY),
                        { name: 'AES-GCM' },
                        false,
                        ['decrypt']
                    );

                    // For client-side decryption without auth tag validation
                    const decrypted = await crypto.subtle.decrypt(
                        { name: 'AES-GCM', iv: iv, tagLength: 128 },
                        cryptoKey,
                        encrypted
                    );

                    const serverTime = parseInt(new TextDecoder().decode(decrypted), 10);
                    
                    // Calculate time offset (how far ahead/behind we are)
                    timeOffset = clientTime - serverTime;
                    lastTimeSyncTime = clientTime;

                    console.log(`✅ Time synced. Server: ${serverTime}ms, Client: ${clientTime}ms, Offset: ${timeOffset}ms`);
                    return true;
                } catch (decryptErr) {
                    console.warn('Failed to decrypt server time:', decryptErr);
                    return false;
                }
            } catch (error) {
                console.error('Time sync error:', error);
                return false;
            }
        }

        // Get synchronized server time
        function getSyncedServerTime() {
            const clientNow = Date.now();
            return clientNow - timeOffset;
        }

        // Sort messages by DECRYPTED timestamp (async version for cache sorting)
        async function sortMessagesByDecryptedTimestamp(messages) {
            try {
                // Create array of [message, decryptedTimestamp] pairs
                const messagesWithTimestamps = await Promise.all(
                    messages.map(async (msg) => {
                        try {
                            const timestamp = await decryptServerTimestamp(msg.encryptedTimestamp);
                            return { message: msg, timestamp };
                        } catch (err) {
                            console.warn(`Failed to decrypt timestamp for message ${msg.id}, using 0`);
                            return { message: msg, timestamp: 0 };
                        }
                    })
                );

                // Sort by timestamp numerically
                messagesWithTimestamps.sort((a, b) => a.timestamp - b.timestamp);

                // Return sorted messages
                return messagesWithTimestamps.map(item => item.message);
            } catch (error) {
                console.error('Error sorting messages by timestamp:', error);
                // Fallback: return unsorted messages
                return messages;
            }
        }

        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            const oneDay = 24 * 60 * 60 * 1000;

            if (diff < oneDay && date.getDate() === now.getDate()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (diff < oneDay * 2) {
                return 'Yesterday';
            } else if (diff < oneDay * 7) {
                return date.toLocaleDateString([], { weekday: 'short' });
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }

        function filterChats(e) {
            const filter = e.target.value;
            renderChatList(filter);
        }

        function openNewChatModal() {
            newChatHandle.value = '';
            newChatKey.value = '';
            newChatModal.classList.add('active');
        }

        function closeNewChatModal() {
            newChatModal.classList.remove('active');

        function createNewChat() {
            const handle = newChatHandle.value.trim();
            const key = newChatKey.value.trim();

            if (!handle || !key) {
                showToast('Please fill in all fields', 'error');
                return;
            }

            // Check if chat already exists
            if (chats.some(chat => chat.handle.toLowerCase() === handle.toLowerCase())) {
                showToast('Chat with this handle already exists', 'error');
                return;
            }

            // Add new chat
            chats.push({
                handle: handle,
                encryptionKey: key,
                lastMessage: '',
                lastMessageTime: null,
                unreadCount: 0
            });

            saveChats();
            closeNewChatModal();
            renderChatList();
            openChat(handle);

        function deleteChat(handle) {
            if (!confirm(`Delete chat "${handle}"? This cannot be undone.`)) {
                return;
            }

            chats = chats.filter(chat => chat.handle !== handle);
            saveChats();
            renderChatList();
            showToast('Chat deleted', 'success');
        }

        function openChat(handle) {
            currentChat = chats.find(chat => chat.handle === handle);
            if (!currentChat) return;

            // Cleanup before opening new chat
            cleanupAllBlobUrls();
            for (const [player, { audio }] of activeAudioPlayers.entries()) {
                audio.pause();
                audio.src = '';
            }
            activeAudioPlayers.clear();

            chatListContainer.style.display = 'none';
            chatContainer.style.display = 'flex';

            chatName.textContent = currentChat.handle;
            chatAvatar.textContent = currentChat.handle.charAt(0).toUpperCase();

            statusText.textContent = 'Connecting...';

            renderedMessageIds.clear();
            messagesContainer.innerHTML = '';
            messageDeliveryStatus.clear();

            // Clear unread count when opening the chat
            currentChat.unreadCount = 0;
            saveChats();

            // Load cached messages from localStorage
            loadCachedMessages(handle);
            
            // Track the last fetch time for incremental updates
            lastFetchTime = 0;

            startPolling();
            startHeartbeat();
        }

        function backToChatList() {
            stopPolling();
            stopHeartbeat();
            
            // Cleanup blob URLs to prevent memory leaks
            cleanupAllBlobUrls();
            
            // Cleanup audio players
            for (const [player, { audio }] of activeAudioPlayers.entries()) {
                audio.pause();
                audio.src = '';
            }
            activeAudioPlayers.clear();
            
            chatContainer.style.display = 'none';
            chatListContainer.style.display = 'flex';
            renderChatList();
            // Restart polling on the other chats when going back to list
            startChatListPolling();

        function startHeartbeat() {
            if (heartbeatInterval) return;

            // Send initial heartbeat
            sendHeartbeat();

            // Send heartbeat every 5 seconds
            heartbeatInterval = setInterval(sendHeartbeat, 5000);
        }

        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }

        async function sendHeartbeat() {
            if (!currentChat) return;

            try {
                connectionStatus = 'connecting';
                updateConnectionStatus();

                // Encrypt the userName before sending
                const encryptedUserName = await encryptMessage(userName, currentChat.encryptionKey);

                const response = await authenticatedFetch(`/heartbeat/${currentChat.handle}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ encryptedUserName: encryptedUserName })
                });

                // Check for authentication failure
                if (response.status === 401) {
                    failedAuthAttempts++;
                    console.warn(`Authentication failed on heartbeat. Attempts: ${failedAuthAttempts}/${AUTH_FAILURE_THRESHOLD}`);
                    
                    if (failedAuthAttempts >= AUTH_FAILURE_THRESHOLD) {
                        console.error('Persistent authentication failures detected. Redirecting to login...');
                        logout(true); // Automatic logout without confirmation
                    }
                    throw new Error(`Heartbeat failed: ${response.status}`);
                }

                // Reset counter on successful response
                failedAuthAttempts = 0;

                if (!response.ok) {
                    throw new Error(`Heartbeat failed: ${response.status}`);
                }

                // Parse X-Online-Users header
                const onlineUsersHeader = response.headers.get('X-Online-Users');
                if (onlineUsersHeader) {
                    parseOnlineUsers(onlineUsersHeader);
                }

                connectionStatus = 'connected';
                updateConnectionStatus();
            } catch (error) {
                console.error('Heartbeat error:', error);
                connectionStatus = 'disconnected';
                updateConnectionStatus();
            }
        }

        async function parseOnlineUsers(headerValue) {
            if (!headerValue || headerValue.trim() === '') {
                return;
            }

            // Decode header value since it was URL-encoded on the server for non-ASCII characters
            const decodedHeaderValue = decodeURIComponent(headerValue);

            // Parse header: encryptedUserName|status,encryptedUserName|status,...
            const users = await Promise.all(decodedHeaderValue.split(',').map(async (userStr) => {
                const [encryptedUserName, status] = userStr.split('|');
                try {
                    // Decrypt the user name using the chat's encryption key
                    const userName = await decryptMessage(encryptedUserName, currentChat.encryptionKey);
                    return { userName, status };
                } catch (err) {
                    // If decryption fails, return the encrypted value as fallback
                    console.warn('Failed to decrypt user name:', err);
                    return { userName: encryptedUserName, status };
                }
            }));

            console.log('Online users:', users);
            // Store for future use and update indicators
            currentChat.onlineUsers = users;
            
            // Update message status indicators without re-rendering
            updateMessageStatusIndicators(users);
        }

        function updateConnectionStatus() {
            if (connectionStatus === 'connected') {
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';
            } else if (connectionStatus === 'connecting') {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Connecting...';
            } else {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Offline';
            }
        }

        function updateMessageStatusIndicators(onlineUsers) {
            // Find all status indicators with data-status-user attribute
            const indicators = document.querySelectorAll('[data-status-user]');
            
            // Create a map for faster lookup
            const userStatusMap = {};
            onlineUsers.forEach(user => {
                userStatusMap[user.userName] = user.status;
            });
            
            // Update each indicator
            indicators.forEach(indicator => {
                const userName = indicator.getAttribute('data-status-user');
                const status = userStatusMap[userName];
                
                if (status) {
                    // Remove existing status classes
                    indicator.classList.remove('online', 'offline');
                    
                    // Add appropriate class based on status
                    if (status === 'online') {
                        indicator.classList.add('online');
                    } else {
                        indicator.classList.add('offline');
                    }
                }
            });
        }

        function startPolling() {
            if (isPolling) return;

            isPolling = true;
            pollingInterval = setInterval(fetchMessages, 2000);
        }

        function stopPolling() {
            if (!isPolling) return;

            isPolling = false;
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        async function fetchMessages() {
            if (!currentChat) return;

            // Use global polling cursor for this chat, not local rendered message IDs
            const pollingCursor = pollingCursors[currentChat.handle] || '';
            const url = pollingCursor
                ? `/messages/${currentChat.handle}?after=${encodeURIComponent(pollingCursor)}`
                : `/messages/${currentChat.handle}`;

            try {
                const response = await authenticatedFetch(url, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                // Check for authentication failure
                if (response.status === 401) {
                    failedAuthAttempts++;
                    console.warn(`Authentication failed. Attempts: ${failedAuthAttempts}/${AUTH_FAILURE_THRESHOLD}`);

                    if (failedAuthAttempts >= AUTH_FAILURE_THRESHOLD) {
                        console.error('Persistent authentication failures detected. Redirecting to login...');
                        logout(true); // Automatic logout without confirmation
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Reset counter on successful response
                failedAuthAttempts = 0;

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const messages = await response.json();
                const newMessagesReceived = messages.length > 0;
                await appendMessages(messages);

                // Update polling cursor immediately after receiving new messages (before next fetch)
                if (newMessagesReceived && messages.length > 0) {
                    const latestMessage = messages[messages.length - 1];
                    pollingCursors[currentChat.handle] = latestMessage.id; // Use encrypted timestamp from server
                    savePollingCursors(); // Persist to localStorage
                }
            } catch (error) {
                console.error('Fetch error:', error);
            }
        }

        async function appendMessages(messages) {
            // Collect all messages (both cached and new) for caching
            let allMessages = [];
            let hasNewMessages = false;
            
            for (const message of messages) {
                if (renderedMessageIds.has(message.id)) continue;

                hasNewMessages = true;

                const messageElement = document.createElement('div');
                messageElement.className = 'message-group';
                messageElement.dataset.messageId = message.id;

                let senderName;
                try {
                    senderName = await decryptMessage(message.encryptedName, currentChat.encryptionKey);
                } catch (err) {
                    // Failed to decrypt sender name - skip this message entirely
                    console.warn('Failed to decrypt sender name for message:', message.id);
                    allMessages.push(message);
                    renderedMessageIds.add(message.id);
                    continue;
                }

                const isOwn = senderName === userName;
                const bubbleClass = isOwn ? 'own' : 'received';

                // Decrypt server timestamp and apply time offset for display
                let timeStr = '';
                try {
                    const serverTimestamp = parseInt(await decryptServerTimestamp(message.encryptedTimestamp));
                    const syncedTimestamp = serverTimestamp + timeOffset;
                    const time = new Date(syncedTimestamp);
                    timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                } catch (err) {
                    timeStr = '--:--';
                }

                const isVoice = message.type === 'voice';
                const isImage = message.type === 'image';
                const isMedia = isVoice || isImage;

                let contentHtml = '';

                try {
                    if (isVoice) {
                        // Check if content is already cached (full content, not placeholder)
                        const cachedContent = await getCachedContent(message.id);
                        if (cachedContent && cachedContent !== 'PLACEHOLDER') {
                            // Content is cached, decrypt and render immediately
                            const decryptedAudioBuffer = await decryptBinary(cachedContent, currentChat.encryptionKey);
                            const audioBlob = new Blob([decryptedAudioBuffer], { type: 'audio/webm' });
                            const audioUrl = createTrackedBlobUrl(audioBlob);
                            const audio = new Audio(audioUrl);

                            const duration = await new Promise(resolve => {
                                audio.addEventListener('loadedmetadata', () => {
                                    resolve(audio.duration);
                                });
                                audio.addEventListener('error', () => {
                                    resolve(0);
                                });
                            });

                            const voicePlayer = await createVoicePlayer(audioUrl, duration);
                            contentHtml = voicePlayer;
                        } else if (message.encryptedContent === null) {
                            // Content stored separately - show download button for everyone who doesn't have cache
                            contentHtml = createDeferredContentButton(message.id, 'voice');
                        } else {
                            // Content embedded in message (legacy support)
                            if (message.encryptedContent) {
                                // Cache and render immediately
                                await cacheContentWithQuota(message.id, message.encryptedContent);
                                const decryptedAudioBuffer = await decryptBinary(message.encryptedContent, currentChat.encryptionKey);
                                const audioBlob = new Blob([decryptedAudioBuffer], { type: 'audio/webm' });
                                const audioUrl = createTrackedBlobUrl(audioBlob);
                                const audio = new Audio(audioUrl);

                                const duration = await new Promise(resolve => {
                                    audio.addEventListener('loadedmetadata', () => {
                                        resolve(audio.duration);
                                    });
                                    audio.addEventListener('error', () => {
                                        resolve(0);
                                    });
                                });

                                const voicePlayer = await createVoicePlayer(audioUrl, duration);
                                contentHtml = voicePlayer;
                            } else {
                                // Fallback: show download button
                                contentHtml = createDeferredContentButton(message.id, 'voice');
                            }
                        }
                    } else if (isImage) {
                        // Check if content is already cached
                        const cachedContent = await getCachedContent(message.id);
                        if (cachedContent && cachedContent !== 'PLACEHOLDER') {
                            // Content is cached, decrypt and render immediately
                            const decryptedImageBuffer = await decryptBinary(cachedContent, currentChat.encryptionKey);
                            const imageBlob = new Blob([decryptedImageBuffer], { type: 'image/*' });
                            const imageUrl = createTrackedBlobUrl(imageBlob);

                            contentHtml = `<img class="message-image" src="${imageUrl}" alt="Image" onclick="openLightbox('${imageUrl}')">`;
                        } else if (message.encryptedContent === null) {
                            // Content stored separately - show download button for everyone who doesn't have cache
                            contentHtml = createDeferredContentButton(message.id, 'image');
                        } else {
                            // Content embedded in message (legacy support)
                            if (message.encryptedContent) {
                                // Cache and render immediately
                                await cacheContentWithQuota(message.id, message.encryptedContent);
                                const decryptedImageBuffer = await decryptBinary(message.encryptedContent, currentChat.encryptionKey);
                                const imageBlob = new Blob([decryptedImageBuffer], { type: 'image/*' });
                                const imageUrl = createTrackedBlobUrl(imageBlob);

                                contentHtml = `<img class="message-image" src="${imageUrl}" alt="Image" onclick="openLightbox('${imageUrl}')">`;
                            } else {
                                // Fallback: show download button
                                contentHtml = createDeferredContentButton(message.id, 'image');
                            }
                        }
                    } else {
                        const decrypted = await decryptMessage(message.encryptedContent, currentChat.encryptionKey);
                        contentHtml = `<div class="message-content">${escapeHtml(decrypted)}</div>`;
                    }
                } catch (err) {
                    // For deferred content, just show the download button
                    if (isVoice || isImage) {
                        const contentType = isVoice ? 'voice' : 'image';
                        contentHtml = createDeferredContentButton(message.id, contentType);
                    } else {
                        // Failed to decrypt message content - skip this message entirely
                        console.warn('Failed to decrypt message content for message:', message.id, err);
                        allMessages.push(message);
                        renderedMessageIds.add(message.id);
                        continue;
                    }
                }

                // Create message bubble
                const messageBubble = document.createElement('div');
                messageBubble.className = `message ${bubbleClass}`;
                
                // Add sender if not own message
                if (!isOwn) {
                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'message-header';
                    const senderSpan = document.createElement('span');
                    senderSpan.className = 'message-sender';
                    
                    // Add status indicator with data attribute
                    const statusIndicator = document.createElement('span');
                    statusIndicator.className = 'status-indicator offline'; // Default to offline
                    statusIndicator.setAttribute('data-status-user', senderName);
                    
                    senderSpan.appendChild(statusIndicator);
                    senderSpan.appendChild(document.createTextNode(senderName));
                    headerDiv.appendChild(senderSpan);
                    messageBubble.appendChild(headerDiv);
                }
                
                // Add time
                const timeHeaderDiv = document.createElement('div');
                timeHeaderDiv.className = 'message-header';
                const timeSpan = document.createElement('span');
                timeSpan.className = 'message-time';
                timeSpan.textContent = timeStr;
                timeHeaderDiv.appendChild(timeSpan);
                messageBubble.appendChild(timeHeaderDiv);
                
                // Add content (voice player or other content)
                if (typeof contentHtml === 'string') {
                    // For images and text, use innerHTML
                    const contentDiv = document.createElement('div');
                    contentDiv.innerHTML = contentHtml;
                    messageBubble.appendChild(contentDiv);
                } else {
                    // For voice player, append DOM element directly
                    messageBubble.appendChild(contentHtml);
                }
                
                messageElement.appendChild(messageBubble);

                messagesContainer.appendChild(messageElement);
                renderedMessageIds.add(message.id);

                // Update last message in chat list
                const tempDiv = document.createElement('div');
                if (typeof contentHtml === 'string') {
                    tempDiv.innerHTML = contentHtml;
                } else {
                    tempDiv.textContent = 'Voice message';
                }
                const textContent = tempDiv.textContent || tempDiv.innerText || 'Media message';
                // Update last message time using decrypted and synced timestamp
                try {
                    const serverTimestamp = parseInt(await decryptServerTimestamp(message.encryptedTimestamp));
                    const syncedTimestamp = serverTimestamp + timeOffset;
                    const timestampStr = new Date(syncedTimestamp).toISOString();
                    updateLastMessage(currentChat.handle, textContent, timestampStr);
                } catch (err) {
                    updateLastMessage(currentChat.handle, textContent, new Date().toISOString());
                }
                
                // Add to all messages for caching
                allMessages.push(message);
            }

            // Save new messages to cache (merge with existing cache) and update polling cursor
            if (allMessages.length > 0 && currentChat) {
                const cacheKey = `messages_${currentChat.handle}`;
                const cachedMessagesJson = localStorage.getItem(cacheKey);
                let existingMessages = [];

                if (cachedMessagesJson) {
                    try {
                        existingMessages = JSON.parse(cachedMessagesJson);
                    } catch (e) {
                        console.error('Error parsing cache:', e);
                    }
                }

                // Merge: keep existing messages and add new ones, avoiding duplicates by ID
                const messageMap = new Map();
                existingMessages.forEach(msg => messageMap.set(msg.id, msg));
                allMessages.forEach(msg => messageMap.set(msg.id, msg));

                // Sort by DECRYPTED timestamp (use async function for proper numeric comparison)
                const unsortedMessages = Array.from(messageMap.values());
                const mergedMessages = await sortMessagesByDecryptedTimestamp(unsortedMessages);

                // Update polling cursor to the latest message timestamp for this chat
                if (mergedMessages.length > 0) {
                    const latestMessage = mergedMessages[mergedMessages.length - 1];
                    pollingCursors[currentChat.handle] = latestMessage.id;
                }

                saveCachedMessages(currentChat.handle, mergedMessages);
            }
        }


        function updateLastMessage(handle, messageContent, timestamp) {
            const chat = chats.find(c => c.handle === handle);
            if (chat) {
                chat.lastMessage = messageContent;
                chat.lastMessageTime = timestamp;
                saveChats();
            }
        }
