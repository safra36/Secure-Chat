<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Password</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0e0e0e;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #4fc3f7;
            --error: #e74c3c;
            --success: #2ecc71;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
        }

        .container {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            background: #3d3d3d;
            box-shadow: 0 0 0 2px var(--accent);
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 195, 247, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: var(--error);
            margin-top: 15px;
            display: none;
            font-size: 14px;
            text-align: center;
            background: rgba(231, 76, 60, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .success {
            color: var(--success);
            margin-top: 15px;
            display: none;
            font-size: 14px;
            text-align: center;
            background: rgba(46, 204, 113, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .error.show,
        .success.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        {KEY_PLACE_HOLDER}
        <h1>Secure Access</h1>
        <div class="form-group">
            <label for="server-password">Enter Server Password to Continue:</label>
            <input type="password" id="server-password" placeholder="Enter password">
        </div>
        <button id="submit-btn">Submit</button>
        <div id="error-message" class="error">Incorrect password. Please try again.</div>
        <div id="success-message" class="success">Access granted! Redirecting...</div>
    </div>

    <script>

        function padKey(keyStr) {
            // Pad/truncate to 32 bytes (256 bits)
            const encoder = new TextEncoder();
            const data = encoder.encode(keyStr);
            const padded = new Uint8Array(32);
            padded.set(data.slice(0, 32));   // truncate if >32
            // leave rest zero‑filled if <32
            return padded;
        }

        // AES-256-GCM Encryption for text messages
        async function encryptMessage(message, key) {

            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);

                // Generate a random IV
                const iv = crypto.getRandomValues(new Uint8Array(12));

                // Import the key
                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(key),
                    { name: 'AES-GCM' },
                    false,
                    ['encrypt']
                );

                // Encrypt
                const encrypted = await crypto.subtle.encrypt(
                    {
                        name: 'AES-GCM',
                        iv: iv
                    },
                    cryptoKey,
                    data
                );

                // Combine IV and encrypted data
                const result = new Uint8Array(iv.length + encrypted.byteLength);
                result.set(iv, 0);
                result.set(new Uint8Array(encrypted), iv.length);

                // Convert to base64 for transmission
                const base64Result = btoa(String.fromCharCode(...result));

                return base64Result;
            } catch (error) {
                throw error;
            }
        }

        // AES-256-GCM Decryption
        async function decryptMessage(encryptedMessage, key) {

            try {
                // Convert from base64
                const data = new Uint8Array(atob(encryptedMessage).split('').map(c => c.charCodeAt(0)));

                // Extract IV (first 12 bytes) and encrypted data
                const iv = data.slice(0, 12);
                const encrypted = data.slice(12);

                // Import the key *with the same padding as in encryptMessage*
                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(key),               // <‑‑ use padKey here
                    { name: 'AES-GCM' },
                    false,
                    ['decrypt']
                );

                // Decrypt
                const decrypted = await crypto.subtle.decrypt(
                    {
                        name: 'AES-GCM',
                        iv: iv
                    },
                    cryptoKey,
                    encrypted
                );

                // Convert to string
                const result = new TextDecoder().decode(decrypted);

                return result;
            } catch (error) {
                throw error;
            }
        }

        document.getElementById('submit-btn').addEventListener('click', validatePassword);
        document.getElementById('server-password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') validatePassword();
        });

        async function validatePassword() {
            const passwordInput = document.getElementById('server-password');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');

            // Hide any existing messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            
            // Remove shake animation if present
            passwordInput.style.animation = 'none';

            const keyData = document.getElementById('public_key').value;
            const userKey = passwordInput.value;

            try {
                const key = await decryptMessage(keyData, userKey);
                const variables = {
                    userId : key.split(":")[0],
                    privateKey : key.split(":")[1]
                }

                localStorage.setItem("privateKey", variables.privateKey);
                localStorage.setItem("userId", variables.userId);

                // Show success message
                successMessage.classList.add('show');
                
                // Clear input and redirect after short delay
                passwordInput.value = '';
                setTimeout(() => {
                    window.location = "/chat/login";
                }, 500);
                
            } catch(e) {
                // Show error message with shake animation
                errorMessage.classList.add('show');
                passwordInput.style.animation = 'shake 0.5s ease-in-out';
                
                // Clear input after a short delay
                setTimeout(() => {
                    passwordInput.value = '';
                    passwordInput.style.animation = 'none';
                }, 500);
            }
        }

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20%, 60% { transform: translateX(-10px); }
                40%, 80% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        document.addEventListener("DOMContentLoaded", async () => {
            // Check if user already has valid credentials
            const savedPrivateKey = localStorage.getItem("privateKey");
            const savedUserId = localStorage.getItem("userId");

            if (savedPrivateKey && savedUserId) {
                // User is already authenticated, verify with server
                const hashBuffer = await crypto.subtle.digest("SHA-256", `${savedPrivateKey}:${Date.now() - (Date.now() % 5000)}`);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                const response = await fetch("/verify", {
                    method: 'GET',
                    headers: { "authorization" : `${savedUserId}:${hashHex}` }
                });

                if (response.ok) {
                    // Credentials are valid, redirect to chat
                    window.location = "/chat/login";
                    return;
                } else {
                    // Credentials invalid, clear them
                    localStorage.removeItem("privateKey");
                    localStorage.removeItem("userId");
                }
            }

            // User needs to authenticate, show login form
            // (no action needed, form is already visible)
        })
    </script>
</body>

</html>
