<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0e0e0e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Secure Chat">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
    <title>Server Password</title>
    <style>
        /* Modern CSS Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Modern Dark Theme Palette */
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --bg-elevated: #22222e;
            --bg-glass: rgba(18, 18, 26, 0.85);
            
            /* Text Colors */
            --text-primary: #ffffff;
            --text-secondary: #8b8b9e;
            --text-muted: #5a5a6e;
            
            /* Accent Colors - Modern Blue-Purple Gradient */
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            
            /* Status Colors */
            --error: #ef4444;
            --success: #10b981;
            
            /* Border & Shadows */
            --border-color: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.12);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px var(--accent-glow);
            
            /* Spacing */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            
            /* Typography */
            --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            --font-size-base: 15px;
            --font-size-lg: 17px;
            --font-size-xl: 20px;
            --font-size-2xl: 24px;
            --font-size-3xl: 28px;
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-base: 250ms ease;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-family);
            background:
                radial-gradient(ellipse at 20% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                var(--bg-primary);
            color: var(--text-primary);
        }

        /* Modern Glassmorphism Container */
        .container {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 48px 36px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: var(--shadow-lg), 0 0 60px rgba(99, 102, 241, 0.08);
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 30px;
            font-size: var(--font-size-3xl);
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
            font-weight: 500;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: var(--font-size-base);
            transition: all var(--transition-base);
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-elevated);
            box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow-glow);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        /* Modern Button */
        button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: var(--font-size-base);
            font-weight: 600;
            width: 100%;
            transition: all var(--transition-base);
            margin-top: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md), 0 0 20px var(--accent-glow);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            opacity: 0;
            transition: opacity var(--transition-base);
        }

        button:hover::before {
            opacity: 1;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), 0 0 30px var(--accent-glow);
        }

        button:active {
            transform: translateY(0);
        }

        /* Modern Error/Success Messages */
        .error {
            color: var(--error);
            margin-top: 16px;
            display: none;
            font-size: var(--font-size-sm);
            text-align: center;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px 16px;
            border-radius: var(--radius-md);
        }

        .success {
            color: var(--success);
            margin-top: 16px;
            display: none;
            font-size: var(--font-size-sm);
            text-align: center;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 12px 16px;
            border-radius: var(--radius-md);
        }

        .error.show,
        .success.show {
            display: block;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .remember-me label {
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            margin: 0;
        }

        .session-info {
            font-size: var(--font-size-xs);
            color: var(--text-muted);
            margin-top: 10px;
            font-weight: 500;
        }

        /* ===================== DESKTOP LAYOUT ===================== */
        @media (min-width: 1024px) {
            .container {
                max-width: 480px;
                padding: 56px 44px;
            }

            h1 {
                font-size: 32px;
                margin-bottom: 36px;
            }

            .form-group {
                margin-bottom: 28px;
            }

            label {
                font-size: var(--font-size-sm);
                margin-bottom: 12px;
            }

            input {
                padding: 18px 24px;
                font-size: var(--font-size-lg);
            }

            button {
                padding: 18px 28px;
                font-size: var(--font-size-lg);
                margin-top: 16px;
            }

            .remember-me {
                margin: 24px 0;
                gap: 12px;
            }

            .remember-me input[type="checkbox"] {
                width: 20px;
                height: 20px;
            }

            .remember-me label {
                font-size: var(--font-size-base);
            }

            .session-info {
                font-size: var(--font-size-sm);
                margin-top: 12px;
            }
        }

        /* ===================== LARGE DESKTOP ===================== */
        @media (min-width: 1440px) {
            .container {
                max-width: 520px;
            }
        }

        /* ===================== TOUCH DEVICE OPTIMIZATIONS ===================== */
        @media (hover: none) and (pointer: coarse) {
            button:hover {
                transform: none;
            }

            button:active {
                transform: scale(0.98);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        {KEY_PLACE_HOLDER}
        <h1>Secure Access</h1>
        <div class="form-group">
            <label for="server-password">Enter Server Password to Continue:</label>
            <input type="password" id="server-password" placeholder="Enter password">
        </div>
        
        <label class="remember-me">
            <input type="checkbox" id="remember-me" checked>
            <label for="remember-me">Remember me on this device</label>
        </label>
        <div class="session-info">Stay logged in for 7 days</div>
        
        <button id="submit-btn">Submit</button>
        <div id="error-message" class="error">Incorrect password. Please try again.</div>
        <div id="success-message" class="success">Access granted! Redirecting...</div>
    </div>

    <script>
        // Store page load time immediately for accurate time offset calculation
        window.pageLoadTime = Date.now();

        // Session configuration
        const SESSION_CONFIG = {
            REMEMBER_DURATION: 7 * 24 * 60 * 60 * 1000, // 7 days
            SHORT_SESSION_DURATION: 24 * 60 * 60 * 1000, // 24 hours (if not checked)
            CHECK_INTERVAL: 60 * 1000 // Check every minute if session is expired
        };

        /**
         * Check if the current session is still valid
         * @returns {boolean} True if session is valid, false if expired or missing
         */
        function isSessionValid() {
            const savedPrivateKey = localStorage.getItem("privateKey");
            const savedUserId = localStorage.getItem("userId");
            const sessionLoginTime = localStorage.getItem("sessionLoginTime");

            if (!savedPrivateKey || !savedUserId || !sessionLoginTime) {
                return false;
            }

            const loginTime = parseInt(sessionLoginTime, 10);
            const now = Date.now();
            const sessionDuration = localStorage.getItem("sessionDuration");
            const maxAge = sessionDuration ? parseInt(sessionDuration, 10) : SESSION_CONFIG.REMEMBER_DURATION;

            if (now - loginTime > maxAge) {
                console.log('[Session] Session expired, clearing credentials');
                clearCredentials();
                return false;
            }

            return true;
        }

        /**
         * Store session login time
         */
        function storeSessionInfo(rememberMe, duration) {
            localStorage.setItem("sessionLoginTime", Date.now().toString());
            localStorage.setItem("sessionDuration", duration.toString());
            localStorage.setItem("sessionRememberMe", rememberMe ? "true" : "false");
        }

        /**
         * Clear all credentials and session data
         */
        function clearCredentials() {
            localStorage.removeItem("privateKey");
            localStorage.removeItem("publicKey");
            localStorage.removeItem("userId");
            localStorage.removeItem("serverPassword");
            localStorage.removeItem("sessionLoginTime");
            localStorage.removeItem("sessionDuration");
            localStorage.removeItem("sessionRememberMe");
            localStorage.removeItem("pageLoadTime");
            localStorage.removeItem("serverTime");
        }

        /**
         * Start session expiry checker
         * Checks periodically if session has expired and redirects to login if so
         */
        function startSessionExpiryChecker() {
            // Clear any existing checker
            if (window.sessionExpiryInterval) {
                clearInterval(window.sessionExpiryInterval);
            }

            window.sessionExpiryInterval = setInterval(() => {
                if (!isSessionValid()) {
                    // Session expired, redirect to login
                    console.log('[Session] Session expired, redirecting to login');
                    clearCredentials();
                    window.location.href = '/';
                }
            }, SESSION_CONFIG.CHECK_INTERVAL);
        }

        // Export clearCredentials for use in other pages
        window.clearCredentials = clearCredentials;
        window.startSessionExpiryChecker = startSessionExpiryChecker;
        window.isSessionValid = isSessionValid;

        function padKey(keyStr) {

            // Pad/truncate to 32 bytes (256 bits)
            const encoder = new TextEncoder();
            const data = encoder.encode(keyStr);
            const padded = new Uint8Array(32);
            padded.set(data.slice(0, 32));   // truncate if >32
            // leave rest zero‑filled if <32
            return padded;
        }

        // AES-256-GCM Encryption for text messages
        async function encryptMessage(message, key) {

            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);

                // Generate a random IV
                const iv = crypto.getRandomValues(new Uint8Array(12));

                // Import the key
                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(key),
                    { name: 'AES-GCM' },
                    false,
                    ['encrypt']
                );

                // Encrypt
                const encrypted = await crypto.subtle.encrypt(
                    {
                        name: 'AES-GCM',
                        iv: iv
                    },
                    cryptoKey,
                    data
                );

                // Combine IV and encrypted data
                const result = new Uint8Array(iv.length + encrypted.byteLength);
                result.set(iv, 0);
                result.set(new Uint8Array(encrypted), iv.length);

                // Convert to base64 for transmission
                const base64Result = btoa(String.fromCharCode(...result));

                return base64Result;
            } catch (error) {
                throw error;
            }
        }

        // AES-256-GCM Decryption
        async function decryptMessage(encryptedMessage, key) {

            try {
                // Convert from base64
                const data = new Uint8Array(atob(encryptedMessage).split('').map(c => c.charCodeAt(0)));

                // Extract IV (first 12 bytes) and encrypted data
                const iv = data.slice(0, 12);
                const encrypted = data.slice(12);

                // Import the key *with the same padding as in encryptMessage*
                const cryptoKey = await crypto.subtle.importKey(
                    'raw',
                    padKey(key),               // <‑‑ use padKey here
                    { name: 'AES-GCM' },
                    false,
                    ['decrypt']
                );

                // Decrypt
                const decrypted = await crypto.subtle.decrypt(
                    {
                        name: 'AES-GCM',
                        iv: iv
                    },
                    cryptoKey,
                    encrypted
                );

                // Convert to string
                const result = new TextDecoder().decode(decrypted);

                return result;
            } catch (error) {
                throw error;
            }
        }

        document.getElementById('submit-btn').addEventListener('click', validatePassword);
        document.getElementById('server-password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') validatePassword();
        });

        async function validatePassword() {
            const passwordInput = document.getElementById('server-password');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');

            // Hide any existing messages
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
            
            // Remove shake animation if present
            passwordInput.style.animation = 'none';

            const keyData = document.getElementById('public_key').value;
            const userKey = passwordInput.value;

            try {
                const decrypted = await decryptMessage(keyData, userKey);

                // Extract server timestamp for time sync (credentials are client-generated)
                let serverTime = null;
                try {
                    serverTime = JSON.parse(decrypted).timestamp || null;
                } catch (e) {}

                // Generate Ed25519 keypair once; reuse on subsequent logins
                if (!localStorage.getItem('userId') || !localStorage.getItem('privateKey') || !localStorage.getItem('publicKey')) {
                    const keypair = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
                    const rawPublicKey = await crypto.subtle.exportKey('raw', keypair.publicKey);
                    const privateKeyJwk = await crypto.subtle.exportKey('jwk', keypair.privateKey);

                    const hashBuffer = await crypto.subtle.digest('SHA-256', rawPublicKey);
                    const userId = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
                    const publicKeyB64 = btoa(String.fromCharCode(...new Uint8Array(rawPublicKey)));

                    localStorage.setItem('privateKey', JSON.stringify(privateKeyJwk));
                    localStorage.setItem('publicKey', publicKeyB64);
                    localStorage.setItem('userId', userId);
                }

                localStorage.setItem("serverPassword", userKey);

                // Store session info based on "Remember Me" checkbox
                const rememberMe = document.getElementById('remember-me').checked;
                const sessionDuration = rememberMe
                    ? SESSION_CONFIG.REMEMBER_DURATION
                    : SESSION_CONFIG.SHORT_SESSION_DURATION;
                storeSessionInfo(rememberMe, sessionDuration);

                // Store page load time and server time for accurate time offset calculation
                if (serverTime) {
                    localStorage.setItem("pageLoadTime", window.pageLoadTime.toString());
                    localStorage.setItem("serverTime", serverTime.toString());
                    console.log(`⏰ Time sync: Server=${serverTime}, PageLoad=${window.pageLoadTime}, Offset=${serverTime - window.pageLoadTime}ms`);
                }

                // Show success message
                successMessage.classList.add('show');

                // Start session expiry checker
                startSessionExpiryChecker();

                // Clear input and redirect after short delay
                passwordInput.value = '';
                setTimeout(() => {
                    window.location = "/chat/login";
                }, 500);
                
            } catch(e) {
                // Show error message with shake animation
                errorMessage.classList.add('show');
                passwordInput.style.animation = 'shake 0.5s ease-in-out';
                
                // Clear input after a short delay
                setTimeout(() => {
                    passwordInput.value = '';
                    passwordInput.style.animation = 'none';
                }, 500);
            }
        }

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20%, 60% { transform: translateX(-10px); }
                40%, 80% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        document.addEventListener("DOMContentLoaded", () => {
            if (isSessionValid()) {
                if (localStorage.getItem('publicKey')) {
                    // New-format Ed25519 credentials — session valid, redirect
                    console.log('[Session] Auto-login successful, starting session checker');
                    startSessionExpiryChecker();
                    window.location = "/chat/login";
                    return;
                }
                // Old-format credentials (no publicKey) — clear and force re-login
                console.log('[Session] Old credential format detected, clearing for re-login');
                clearCredentials();
            } else {
                console.log('[Session] No valid session found, showing login form');
            }
        });

        // Register PWA service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('[PWA] ServiceWorker registration successful:', registration.scope);
                })
                .catch((err) => {
                    console.error('[PWA] ServiceWorker registration failed:', err);
                });
        }
    </script>
</body>

</html>
